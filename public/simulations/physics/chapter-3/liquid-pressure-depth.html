<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Pressure and Depth / তরলের গভীরতা ও চাপ</title>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--blue:#2563eb;--cyan:#0891b2;--teal:#0d9488;--red:#dc2626;--line:#e2e8f0;--shadow:0 10px 15px -3px rgba(0,0,0,0.1);--radius:16px}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}.app{max-width:1100px;margin:0 auto;padding:24px}header{margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end}h1{margin:0;font-size:1.8rem;color:var(--blue)}p.subtitle{margin:4px 0 0;color:var(--muted);font-size:1rem}.lang-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:white;cursor:pointer;font-weight:600;color:var(--muted);transition:0.2s}.lang-btn.active{background:var(--blue);color:white;border-color:var(--blue)}.grid{display:grid;grid-template-columns:320px 1fr;gap:24px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.sidebar{display:flex;flex-direction:column;gap:20px}.card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--line)}.control-group{display:flex;flex-direction:column;gap:8px}.label-row{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:0.9rem}.value-tag{background:var(--blue);color:white;padding:2px 8px;border-radius:4px;font-family:monospace}input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);font-size:1rem;background:white}.main-content{display:flex;flex-direction:column;gap:24px}.visualizer{height:450px;background:#e2e8f0;border-radius:12px;position:relative;overflow:hidden;border:4px solid #94a3b8}.tank{position:absolute;bottom:0;left:10%;right:10%;top:10%;background:white;border:3px solid #64748b;border-top:none}.water{position:absolute;bottom:0;left:0;right:0;background:rgba(37,99,235,0.4);border-top:2px solid var(--blue);transition:height 0.3s ease}.hole-marker{position:absolute;right:0;width:12px;height:12px;background:var(--red);border-radius:50%;transform:translate(50%,-50%);cursor:pointer;box-shadow:0 0 0 4px rgba(220,38,38,0.2)}.stream{position:absolute;fill:rgba(37,99,235,0.6);pointer-events:none}.ruler{position:absolute;left:-40px;top:0;bottom:0;width:30px;border-right:2px solid var(--muted);display:flex;flex-direction:column;justify-content:space-between;padding:10px 0}.ruler-mark{font-size:0.7rem;color:var(--muted);position:relative}.ruler-mark::after{content:'';position:absolute;right:-10px;width:10px;height:1px;background:var(--muted)}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.stat-card{background:white;padding:16px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column}.stat-label{font-size:0.8rem;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:4px}.stat-value{font-size:1.2rem;font-weight:700;color:var(--ink);font-family:monospace}.formula-area{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:1.1rem;font-weight:700;color:var(--blue);text-align:center}.density-info{font-size:0.85rem;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="app">
<header>
<div class="title-area">
<h1 id="title">Liquid Pressure & Depth</h1>
<p class="subtitle" id="subtitle">Visualize how pressure changes with depth and density</p>
</div>
<div class="lang-area">
<button class="lang-btn active" onclick="setLang('en')" id="enBtn">EN</button>
<button class="lang-btn" onclick="setLang('bn')" id="bnBtn">BN</button>
</div>
</header>
<div class="grid">
<div class="sidebar">
<div class="card">
<div class="control-group">
<div class="label-row">
<span id="labelDepth">Water Depth</span>
<span class="value-tag"><span id="valHeight">3</span> m</span>
</div>
<input type="range" id="heightRange" min="1" max="10" step="0.5" value="3" oninput="update()">
</div>
<div class="control-group" style="margin-top:20px">
<div class="label-row">
<span id="labelHole">Hole Depth</span>
<span class="value-tag"><span id="valHole">1.5</span> m</span>
</div>
<input type="range" id="holeRange" min="0.5" max="9.5" step="0.5" value="1.5" oninput="update()">
</div>
<div class="control-group" style="margin-top:20px">
<div class="label-row">
<span id="labelLiquid">Liquid Type</span>
</div>
<select id="liquidType" onchange="update()">
<option value="1000" id="optWater">Water (1000 kg/m³)</option>
<option value="800" id="optOil">Kerosene (800 kg/m³)</option>
<option value="13600" id="optMerc">Mercury (13600 kg/m³)</option>
<option value="1260" id="optGly">Glycerin (1260 kg/m³)</option>
</select>
</div>
<p class="density-info" id="densityNote">Density significantly affects pressure.</p>
</div>
</div>
<div class="main-content">
<div class="visualizer" id="visualizer">
<div class="tank" id="tank">
<div class="water" id="water"></div>
<div class="hole-marker" id="holeMarker"></div>
<svg class="stream" id="streamSvg" width="1000" height="500"></svg>
<div class="ruler" id="ruler">
<!-- Ruler marks via JS -->
</div>
</div>
</div>
<div class="info-grid">
<div class="stat-card">
<span class="stat-label" id="statPL">Pressure at Depth</span>
<span class="stat-value" id="resPressure">14,700 Pa</span>
</div>
<div class="stat-card">
<span class="stat-label" id="statDL">Distance (Jet)</span>
<span class="stat-value" id="resDistance">2.45 m</span>
</div>
<div class="stat-card">
<span class="stat-label" id="statFL">Hydrostatic Force</span>
<span class="stat-value" id="resForce">Moderate</span>
<div class="formula-area">P = hρg</div>
</div>
</div>
</div>
</div>
</div>
<script>
const g = 9.8;
let lang = 'en';
const labels = {
en: {
title: "Liquid Pressure & Depth",
subtitle: "Visualize how pressure changes with depth and density",
depth: "Water Depth",
hole: "Hole Depth",
liquid: "Liquid Type",
statP: "Pressure at Hole",
statD: "Horizontal Range",
statF: "Force Strength",
note: "Pressure depends on depth (h), density (ρ), and gravity (g).",
units: { m: 'm', pa: 'Pa' }
},
bn: {
title: "তরলের গভীরতা ও চাপ",
subtitle: "গভীরতা ও ঘনত্বের সাথে চাপের পরিবর্তন দেখুন",
depth: "তরলের গভীরতা",
hole: "ছিদ্রের গভীরতা",
liquid: "তরলের ধরন",
statP: "ছিদ্রের মুখে চাপ",
statD: "নির্গত তরলের দূরত্ব",
statF: "চাপের মাত্রা",
note: "চাপ নির্ভর করে গভীরতা (h), ঘনত্ব (ρ) এবং অভিকর্ষজ ত্বরণ (g) এর ওপর।",
units: { m: 'মি.', pa: 'প্যাসকেল' }
}
};
function setLang(l) {
lang = l;
document.getElementById('enBtn').classList.toggle('active', l === 'en');
document.getElementById('bnBtn').classList.toggle('active', l === 'bn');
document.getElementById('title').innerText = labels[l].title;
document.getElementById('subtitle').innerText = labels[l].subtitle;
document.getElementById('labelDepth').innerText = labels[l].depth;
document.getElementById('labelHole').innerText = labels[l].hole;
document.getElementById('labelLiquid').innerText = labels[l].liquid;
document.getElementById('statPL').innerText = labels[l].statP;
document.getElementById('statDL').innerText = labels[l].statD;
document.getElementById('statFL').innerText = labels[l].statF;
document.getElementById('densityNote').innerText = labels[l].note;
update();
}
function initRuler() {
const ruler = document.getElementById('ruler');
for (let i = 10; i >= 0; i--) {
const mark = document.createElement('div');
mark.className = 'ruler-mark';
mark.innerText = i + 'm';
ruler.appendChild(mark);
}
}
function update() {
const h = parseFloat(document.getElementById('heightRange').value);
let holeDepth = parseFloat(document.getElementById('holeRange').value);
const rho = parseFloat(document.getElementById('liquidType').value);
// Validation: hole can't be deeper than water
if (holeDepth > h) {
holeDepth = h;
document.getElementById('holeRange').value = h;
}
document.getElementById('valHeight').innerText = h;
document.getElementById('valHole').innerText = holeDepth;
// Calculate Pressure: P = hρg (at the hole)
const pressure = holeDepth * rho * g;
document.getElementById('resPressure').innerText = Math.round(pressure).toLocaleString() + ' ' + labels[lang].units.pa;
// Visuals
const tankHeight = 100; // percent
const waterHeight = (h / 10) * 100;
document.getElementById('water').style.height = waterHeight + '%';
const holePosPercent = (holeDepth / h) * 100;
// Note: depth is from top. Hole pos (from bottom) = total height - depth
const holeFromBottom = ((h - holeDepth) / 10) * 100;
document.getElementById('holeMarker').style.bottom = holeFromBottom + '%';
// Torricelli's Law: v = sqrt(2gh)
const velocity = Math.sqrt(2 * g * holeDepth);
// Horizontal Distance: d = v * t where t is time to fall from hole to bottom
// t = sqrt(2 * y / g) where y is height of hole from bottom
const y = h - holeDepth;
const timeOfFlight = Math.sqrt(2 * y / g);
const horizontalDistance = velocity * timeOfFlight;
document.getElementById('resDistance').innerText = horizontalDistance.toFixed(2) + ' ' + labels[lang].units.m;
// Draw Stream
const svg = document.getElementById('streamSvg');
const tankWidth = document.getElementById('tank').offsetWidth;
const tankPxHeight = document.getElementById('tank').offsetHeight;
const startX = 0;
const startY = (holeDepth / 10) * tankPxHeight + (10 - h)/10 * tankPxHeight;
const rangePx = (horizontalDistance / 10) * tankPxHeight;
// Parabolic path: y = ax^2
let pathD = `M ${startX} ${startY}`;
const segments = 20;
for(let i=1; i<=segments; i++){
const px = (i/segments) * rangePx;
const dx = (i/segments) * horizontalDistance;
// t = dx / v
const dt = dx / velocity;
// dy = 0.5 * g * t^2
const dy = 0.5 * g * (dt * dt);
const py = startY + (dy/10) * tankPxHeight;
pathD += ` L ${px} ${py}`;
}
pathD += ` L ${rangePx} ${startY + (y/10) * tankPxHeight} L 0 ${startY + (y/10) * tankPxHeight} Z`;
svg.innerHTML = `<path d="${pathD}" fill="rgba(37,99,235,0.4)" />`;
svg.style.left = '100%';
svg.style.top = '0';
}
window.onload = () => {
initRuler();
update();
};
</script>
</body>
</html>
