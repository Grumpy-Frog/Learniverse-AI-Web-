<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work, Power, and Efficiency / কাজ, ক্ষমতা ও কর্মদক্ষতা</title>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--blue:#2563eb;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--line:#e2e8f0;--shadow:0 10px 15px -3px rgba(0,0,0,0.1);--radius:16px}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}.app{max-width:1100px;margin:0 auto;padding:24px}header{margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end}h1{margin:0;font-size:1.8rem;color:var(--blue)}p.subtitle{margin:4px 0 0;color:var(--muted);font-size:1rem}.lang-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:white;cursor:pointer;font-weight:600;color:var(--muted);transition:0.2s}.lang-btn.active{background:var(--blue);color:white;border-color:var(--blue)}.grid{display:grid;grid-template-columns:320px 1fr;gap:24px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.sidebar{display:flex;flex-direction:column;gap:20px}.card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--line)}.control-group{display:flex;flex-direction:column;gap:8px}.label-row{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:0.9rem}.value-tag{background:var(--blue);color:white;padding:2px 8px;border-radius:4px;font-family:monospace}input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}.main-content{display:flex;flex-direction:column;gap:24px}.visualizer{height:350px;background:#e2e8f0;border-radius:12px;position:relative;overflow:hidden;border:4px solid #94a3b8}.ground{position:absolute;bottom:0;width:100%;height:40px;background:#4ade80}.worker{position:absolute;bottom:40px;left:50px;width:60px;height:100px;background-size:contain;background-repeat:no-repeat;transition:left 0.1s linear}.box{position:absolute;bottom:40px;left:110px;width:60px;height:60px;background:#f59e0b;border:3px solid #b45309;border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;transition:left 0.1s linear}.distance-line{position:absolute;bottom:20px;left:110px;height:4px;background:var(--blue);transition:width 0.1s linear}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.stat-card{background:white;padding:16px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column}.stat-label{font-size:0.8rem;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:4px}.stat-value{font-size:1.4rem;font-weight:700;color:var(--ink);font-family:monospace}.action-btn{padding:16px;border-radius:12px;border:none;background:var(--blue);color:white;font-weight:700;font-size:1.1rem;cursor:pointer;transition:0.2s}.action-btn:hover{background:#1d4ed8}.action-btn:disabled{background:var(--muted);cursor:not-allowed}.efficiency-container{margin-top:24px;padding:20px;background:#f0f9ff;border-radius:12px;border:1px solid #bae6fd}.eff-bar-bg{height:24px;background:#e2e8f0;border-radius:12px;overflow:hidden;margin-top:8px}.eff-bar-fill{height:100%;background:var(--green);width:0%;transition:width 0.5s ease-out}.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:0.9rem;font-weight:700;color:var(--blue)}
</style>
</head>
<body>
<div class="app">
<header>
<div class="title-area">
<h1 id="title">Work, Power & Efficiency</h1>
<p class="subtitle" id="subtitle">Push the weight and calculate energy metrics</p>
</div>
<div class="lang-area">
<button class="lang-btn active" onclick="setLang('en')" id="enBtn">EN</button>
<button class="lang-btn" onclick="setLang('bn')" id="bnBtn">BN</button>
</div>
</header>
<div class="grid">
<div class="sidebar">
<div class="card">
<div class="control-group">
<div class="label-row">
<span id="labelForce">Pushing Force</span>
<span class="value-tag"><span id="valForce">50</span> N</span>
</div>
<input type="range" id="forceRange" min="10" max="200" step="10" value="50" oninput="update()">
</div>
<div class="control-group" style="margin-top:20px">
<div class="label-row">
<span id="labelTime">Time Duration</span>
<span class="value-tag"><span id="valTime">5</span> s</span>
</div>
<input type="range" id="timeRange" min="1" max="20" step="1" value="5" oninput="update()">
</div>
<div class="control-group" style="margin-top:20px">
<div class="label-row">
<span id="labelEff">Engine Efficiency</span>
<span class="value-tag"><span id="valEff">80</span> %</span>
</div>
<input type="range" id="effRange" min="10" max="100" step="5" value="80" oninput="update()">
</div>
</div>
<button class="action-btn" id="startBtn" onclick="runSimulation()">START SIMULATION</button>
</div>
<div class="main-content">
<div class="visualizer" id="visualizer">
<div class="ground"></div>
<div class="distance-line" id="distLine" style="width:0"></div>
<!-- Simplified Human SVG -->
<svg class="worker" id="worker" viewBox="0 0 60 100">
<circle cx="30" cy="20" r="15" fill="#334155"/>
<line x1="30" y1="35" x2="30" y2="70" stroke="#334155" stroke-width="8"/>
<line x1="30" y1="40" x2="55" y2="60" stroke="#334155" stroke-width="6"/>
<line x1="30" y1="70" x2="15" y2="95" stroke="#334155" stroke-width="6"/>
<line x1="30" y1="70" x2="45" y2="95" stroke="#334155" stroke-width="6"/>
</svg>
<div class="box" id="box">10kg</div>
</div>
<div class="info-grid">
<div class="stat-card">
<span class="stat-label" id="statWL">Work Done</span>
<span class="stat-value" id="workVal">0 J</span>
</div>
<div class="stat-card">
<span class="stat-label" id="statPL">Power Output</span>
<span class="stat-value" id="powerVal">0 W</span>
</div>
<div class="stat-card">
<span class="stat-label" id="statEL">Total Energy In</span>
<span class="stat-value" id="energyVal">0 J</span>
</div>
</div>
<div class="efficiency-container">
<div class="label-row">
<span id="statEffL">Efficiency Meter</span>
<span class="value-tag" id="effPercent">80 %</span>
</div>
<div class="eff-bar-bg">
<div class="eff-bar-fill" id="effFill" style="width:80%"></div>
</div>
<div class="formula-grid">
<div>W = F × d</div>
<div>P = W / t</div>
</div>
</div>
</div>
</div>
</div>
<script>
let lang = 'en';
let isRunning = false;
const labels = {
en: {
title: "Work, Power & Efficiency",
subtitle: "Push the weight and calculate energy metrics",
force: "Pushing Force",
time: "Time Duration",
effL: "Engine Efficiency",
btn: "START SIMULATION",
work: "Work Done",
power: "Power Output",
energy: "Total Energy In",
effMeter: "Efficiency View",
unitJ: "J",
unitW: "W"
},
bn: {
title: "কাজ, ক্ষমতা ও কর্মদক্ষতা",
subtitle: "বস্তুটি ধাক্কা দিন এবং শক্তির পরিমাপ হিসাব করুন",
force: "প্রযুক্ত বল",
time: "সময় ব্যবধান",
effL: "ইঞ্জিনের দক্ষতা",
btn: "সিমুলেশন শুরু করুন",
work: "সম্পাদিত কাজ",
power: "ক্ষমতা",
energy: "মোট প্রদত্ত শক্তি",
effMeter: "কর্মদক্ষতা মিটার",
unitJ: "জুল",
unitW: "ওয়াট"
}
};
function setLang(l) {
lang = l;
document.getElementById('enBtn').classList.toggle('active', l === 'en');
document.getElementById('bnBtn').classList.toggle('active', l === 'bn');
document.getElementById('title').innerText = labels[l].title;
document.getElementById('subtitle').innerText = labels[l].subtitle;
document.getElementById('labelForce').innerText = labels[l].force;
document.getElementById('labelTime').innerText = labels[l].time;
document.getElementById('labelEff').innerText = labels[l].effL;
document.getElementById('startBtn').innerText = labels[l].btn;
document.getElementById('statWL').innerText = labels[l].work;
document.getElementById('statPL').innerText = labels[l].power;
document.getElementById('statEL').innerText = labels[l].energy;
document.getElementById('statEffL').innerText = labels[l].effMeter;
update();
}
function update() {
if (isRunning) return;
const force = document.getElementById('forceRange').value;
const time = document.getElementById('timeRange').value;
const eff = document.getElementById('effRange').value;
document.getElementById('valForce').innerText = force;
document.getElementById('valTime').innerText = time;
document.getElementById('valEff').innerText = eff;
document.getElementById('effPercent').innerText = eff + ' %';
document.getElementById('effFill').style.width = eff + '%';
}
function runSimulation() {
if (isRunning) return;
isRunning = true;
document.getElementById('startBtn').disabled = true;
// Reset
const box = document.getElementById('box');
const worker = document.getElementById('worker');
const distLine = document.getElementById('distLine');
box.style.left = '110px';
worker.style.left = '50px';
distLine.style.width = '0px';
const force = parseFloat(document.getElementById('forceRange').value);
const time = parseFloat(document.getElementById('timeRange').value);
const eff = parseFloat(document.getElementById('effRange').value) / 100;
// Velocity v = F/m * t (Simplified for visual)
// m = 10kg constant for this sim
const velocity = (force / 10) * 5; // scaled velocity
const totalDistance = 0.5 * (force / 10) * (time * time);
// Animation
let start = null;
const duration = time * 1000;
const maxVisualDist = 600;
function animate(timestamp) {
if (!start) start = timestamp;
const progress = timestamp - start;
const step = Math.min(progress / duration, 1);
const currentDistPx = step * maxVisualDist;
box.style.left = (110 + currentDistPx) + 'px';
worker.style.left = (50 + currentDistPx) + 'px';
distLine.style.width = currentDistPx + 'px';
// Update metrics real-time
const currentDistanceMeters = step * (totalDistance / 10); // scale to meaningful meters
const work = force * currentDistanceMeters;
const power = work / (progress / 1000 || 0.1);
const energyIn = work / eff;
document.getElementById('workVal').innerText = Math.round(work) + ' ' + labels[lang].unitJ;
document.getElementById('powerVal').innerText = Math.round(power) + ' ' + labels[lang].unitW;
document.getElementById('energyVal').innerText = Math.round(energyIn) + ' ' + labels[lang].unitJ;
if (progress < duration) {
requestAnimationFrame(animate);
} else {
isRunning = false;
document.getElementById('startBtn').disabled = false;
}
}
requestAnimationFrame(animate);
}
window.onload = update;
</script>
</body>
</html>
